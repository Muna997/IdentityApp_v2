name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --legacy-peer-deps
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npm run build -- --base-href=/IdentityApp_v2/
      - run: cp dist/ClientApp/browser/index.html dist/ClientApp/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ClientApp/dist/ClientApp/browser

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
