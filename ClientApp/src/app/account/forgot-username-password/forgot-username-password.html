<div class="auth-page">
  <div class="auth-card">
    <h1>Forgot Username or Password</h1>
    <form [formGroup]="form" (ngSubmit)="send()">
      <div class="form-group">
        <app-form-input
          type="text"
          placeholder="enter your email"
          formControlName="email"
          label="email"
        >
        </app-form-input>
      </div>

      <button type="submit" class="btn btn-primary btn-block">send</button>
    </form>
  </div>
</div>
