<div class="pagination">
  <button class="pagination-btn" (click)="previousPage()" [disabled]="pageNumber <= 1">
    <i class="bi bi-chevron-left"></i>
    Previous
  </button>
  <span class="pagination-info">Page {{ pageNumber }} of {{ totalPages }}</span>
  <button class="pagination-btn" (click)="nextPage()" [disabled]="pageNumber >= totalPages">
    Next
    <i class="bi bi-chevron-right"></i>
  </button>
</div>
